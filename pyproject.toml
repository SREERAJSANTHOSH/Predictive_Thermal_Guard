[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thermal-fault-guard"
version = "0.1.0"
description = "MQTT logger and PyQt dashboard for an ESP32 thermal monitor"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.1,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[project.scripts]
thermal-monitor = "backend.monitor:main"

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

